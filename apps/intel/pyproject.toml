[project]
name = "intel"
version = "0.2.0"
description = "Competitive-intelligence research and verification service"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40",
    "openai>=1.50",
    "ddgs>=9.0",
    "trafilatura>=1.12",
    "markdown>=3.5",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "rapidfuzz>=3.0",
    "requests>=2.31",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "vercel>=0.3",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]

[tool.vercel]
entrypoint = "intel.api:app"

[[tool.vercel.subscribers]]
entrypoint = "intel.worker"
